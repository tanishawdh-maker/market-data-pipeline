services:
  # ---------- PostgreSQL: stores market data AND Airflow's own records ----------
  db:
    image: postgres:16
    container_name: market-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"                # so psql and local Python scripts can still reach it
    volumes:
      - pgdata:/var/lib/postgresql/data   # the data lives in a named volume, not in the container
      # Scripts in this folder run once, in name order, when the volume is empty (first start)
      - ./sql/000_create_airflow_db.sql:/docker-entrypoint-initdb.d/000_create_airflow_db.sql:ro
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_seed_tickers.sql:/docker-entrypoint-initdb.d/002_seed_tickers.sql:ro
    healthcheck:                   # "healthy" only once the database accepts connections
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------- Airflow: runs the pipeline on a schedule ----------
  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: airflow
    command: standalone            # scheduler + web UI + DAG processor in one container (local development)
    depends_on:
      db:
        condition: service_healthy # wait until the database is ready
    ports:
      - "8080:8080"                # Airflow UI at http://localhost:8080
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"    # no login screen (local laptop only!)
      PYTHONPATH: /opt/airflow/etl
      DB_HOST: db                  # services reach each other by service name
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl

  # ---------- REST API ----------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: market-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"                # API docs at http://localhost:8000/docs
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

volumes:
  pgdata:                          # Docker manages this storage; it survives "docker compose down"